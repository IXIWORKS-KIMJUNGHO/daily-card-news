<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily News Briefing - 2026년 3월 10일</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
    background: #0F172A;
    color: #E2E8F0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const newsData = [
  {
    id: 1,
    level: 'urgent',
    levelLabel: '긴급',
    levelColor: '#EF4444',
    category: '🌍 국제',
    title: '트럼프 "이란 전쟁 마무리 수순" 선언, 이란 즉각 반박',
    summary: '트럼프 대통령이 "전쟁이 마무리 수순"이라며 이란군의 해군·통신·공군이 모두 무력화됐다고 밝혔다. 이에 이란 혁명수비대는 "전쟁의 끝을 결정하는 건 우리"라며 즉각 반박하고, 석유 수출 전면 차단을 경고했다.',
    impact: '종전 시점과 방식에 따라 글로벌 에너지·금융시장 향방이 결정될 전망',
    source: 'VOA코리아, 한국경제, 경향신문'
  },
  {
    id: 2,
    level: 'urgent',
    levelLabel: '긴급',
    levelColor: '#EF4444',
    category: '💰 경제',
    title: '코스피 6%+ 급반등, 서킷브레이커 다음날 5,500선 회복',
    summary: '전날 장중 8% 폭락으로 서킷브레이커가 발동된 코스피가 하루 만에 6% 이상 급등하며 5,500선을 되찾았다. 트럼프의 "종전 임박" 발언에 투자 심리가 빠르게 회복되며 반등에 성공했다.',
    impact: '전쟁 종전 여부에 따른 초고변동성 장세 지속 전망, 투자자 주의 필요',
    source: 'new1cm, Trading Economics'
  },
  {
    id: 3,
    level: 'important',
    levelLabel: '중요',
    levelColor: '#F97316',
    category: '💰 경제',
    title: '국제유가 7% 급락, 브렌트유 배럴당 91달러선으로',
    summary: '트럼프의 종전 시사 발언 이후 국제유가가 급격히 하락했다. 브렌트유는 전일 대비 7% 이상 떨어져 배럴당 91달러를 기록했다. 불과 며칠 전 배럴당 120달러에 육박했던 것에서 크게 하락한 수치다.',
    impact: '유가 안정화 시 글로벌 인플레이션 압력 완화 기대, 그러나 이란의 석유 봉쇄 위협은 여전',
    source: 'Bloomberg, 글로벌이코노믹'
  },
  {
    id: 4,
    level: 'important',
    levelLabel: '중요',
    levelColor: '#F97316',
    category: '🌍 국제',
    title: '이란 새 최고지도자 모즈타바 하메네이 취임',
    summary: '개전 첫날 공습으로 사망한 알리 하메네이의 차남 모즈타바 하메네이(56)가 이란의 새 최고지도자로 취임했다. 그는 결사항전 노선을 천명하며 혁명수비대의 전쟁 지속 의지를 재확인했다.',
    impact: '새 지도부의 강경 노선으로 전쟁 장기화 가능성과 협상 난항 우려',
    source: 'NPR, Al Jazeera'
  },
  {
    id: 5,
    level: 'important',
    levelLabel: '중요',
    levelColor: '#F97316',
    category: '🌍 국제',
    title: '네팔 총선, 래퍼 출신 발렌드라 샤 압승으로 최연소 총리 탄생',
    summary: '네팔 총선에서 래퍼 출신 정치인 발렌드라 샤가 이끄는 라스트리야 스와탄트라당이 165석 중 125석을 차지하며 압승했다. 35세의 샤는 네팔 역사상 최연소 총리가 되며, Gen Z 혁명의 결실을 맺었다.',
    impact: 'Gen Z 세대의 정치 참여가 실질적 정권 교체로 이어진 세계적 사례',
    source: 'NPR, Bloomberg, Al Jazeera'
  },
  {
    id: 6,
    level: 'notable',
    levelLabel: '주목',
    levelColor: '#3B82F6',
    category: '🔬 기술',
    title: '해수면 상승 속도, 기존 예측보다 훨씬 빠르다',
    summary: '새로운 연구에 따르면 인간 활동으로 인한 해수면 상승이 정부 계획보다 훨씬 빠르게 진행되고 있으며, 수천만 명이 추가로 해수면 상승 피해 위험에 노출될 수 있다고 경고했다.',
    impact: '기후 정책 및 해안 도시 방재 계획 전면 재검토 필요성 대두',
    source: 'CBS News, NPR'
  }
];

const keywords = ['이란 종전', '코스피 반등', '유가 급락', '하메네이', '네팔 Gen Z', '해수면 상승'];
const totalComment = '중동 전쟁의 종전 기대감이 글로벌 시장을 뒤흔드는 가운데, 세계 곳곳에서 새로운 변화의 바람이 불고 있다.';

function App() {
  const [currentIndex, setCurrentIndex] = useState(0);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);
  const containerRef = useRef(null);
  const totalCards = newsData.length + 2; // cover + news + closing

  const goTo = useCallback((idx) => {
    if (idx >= 0 && idx < totalCards) setCurrentIndex(idx);
  }, [totalCards]);

  const handleTouchStart = useCallback((e) => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
  }, []);

  const handleTouchEnd = useCallback((e) => {
    if (touchStartX.current === null) return;
    const diffX = touchStartX.current - e.changedTouches[0].clientX;
    const diffY = touchStartY.current - e.changedTouches[0].clientY;
    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
      if (diffX > 0) goTo(currentIndex + 1);
      else goTo(currentIndex - 1);
    }
    touchStartX.current = null;
    touchStartY.current = null;
  }, [currentIndex, goTo]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentIndex + 1);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(currentIndex - 1);
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [currentIndex, goTo]);

  const cardStyle = {
    width: '100%',
    maxWidth: '393px',
    minHeight: '100vh',
    padding: '59px 16px 34px 16px',
    display: 'flex',
    flexDirection: 'column',
    justifyContent: 'center',
    position: 'relative',
  };

  const innerCard = {
    background: '#1E293B',
    borderRadius: '16px',
    padding: '24px 20px',
    flex: 1,
    display: 'flex',
    flexDirection: 'column',
    justifyContent: 'center',
    maxHeight: 'calc(100vh - 59px - 34px - 60px)',
    overflow: 'hidden',
  };

  const renderCover = () => (
    <div style={cardStyle}>
      <div style={{
        ...innerCard,
        background: 'linear-gradient(135deg, #1E293B 0%, #0F172A 50%, #1E293B 100%)',
        alignItems: 'center',
        textAlign: 'center',
        justifyContent: 'center',
        gap: '20px',
        border: '1px solid #334155',
      }}>
        <div style={{ fontSize: '0.85rem', color: '#94A3B8', letterSpacing: '0.05em' }}>
          2026년 3월 10일 화요일
        </div>
        <div style={{
          fontSize: '1.8rem',
          fontWeight: '800',
          letterSpacing: '0.15em',
          background: 'linear-gradient(135deg, #E2E8F0, #94A3B8)',
          WebkitBackgroundClip: 'text',
          WebkitTextFillColor: 'transparent',
          lineHeight: 1.3,
        }}>
          DAILY NEWS<br/>BRIEFING
        </div>
        <div style={{
          width: '60px',
          height: '2px',
          background: 'linear-gradient(90deg, transparent, #3B82F6, transparent)',
        }}/>
        <div style={{ fontSize: '0.85rem', color: '#94A3B8' }}>
          오늘의 뉴스 {newsData.length}건 | 🔴 긴급 {newsData.filter(n => n.level === 'urgent').length}건
        </div>
        <div style={{ fontSize: '0.75rem', color: '#475569', marginTop: '8px' }}>
          ← 스와이프하여 시작 →
        </div>
      </div>
      {renderDots()}
    </div>
  );

  const renderNewsCard = (news, idx) => (
    <div style={cardStyle} key={news.id}>
      <div style={{ ...innerCard, justifyContent: 'flex-start', gap: '14px', paddingTop: '20px' }}>
        {/* Top color bar */}
        <div style={{
          position: 'absolute',
          top: 0,
          left: 0,
          right: 0,
          height: '4px',
          background: news.levelColor,
          borderRadius: '16px 16px 0 0',
        }}/>

        {/* Header row */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <div style={{
              width: '28px',
              height: '28px',
              borderRadius: '50%',
              background: news.levelColor,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '0.75rem',
              fontWeight: '700',
              color: '#fff',
            }}>
              {news.id}
            </div>
            <span style={{
              fontSize: '0.7rem',
              fontWeight: '600',
              color: news.levelColor,
              textTransform: 'uppercase',
              letterSpacing: '0.05em',
            }}>
              {news.levelLabel}
            </span>
          </div>
          <span style={{
            fontSize: '0.75rem',
            background: '#334155',
            padding: '4px 10px',
            borderRadius: '12px',
            color: '#94A3B8',
          }}>
            {news.category}
          </span>
        </div>

        {/* Title */}
        <h2 style={{
          fontSize: '1.2rem',
          fontWeight: '700',
          lineHeight: 1.4,
          color: '#F1F5F9',
        }}>
          {news.title}
        </h2>

        {/* Summary box */}
        <div style={{
          background: '#0F172A',
          borderRadius: '12px',
          padding: '14px 16px',
          fontSize: '0.85rem',
          lineHeight: 1.7,
          color: '#CBD5E1',
        }}>
          {news.summary}
        </div>

        {/* Impact */}
        <div style={{
          display: 'flex',
          alignItems: 'flex-start',
          gap: '8px',
          padding: '10px 14px',
          background: 'rgba(59, 130, 246, 0.08)',
          borderRadius: '10px',
          borderLeft: '3px solid #3B82F6',
        }}>
          <span style={{ fontSize: '0.85rem', flexShrink: 0 }}>💡</span>
          <div>
            <div style={{ fontSize: '0.7rem', color: '#3B82F6', fontWeight: '600', marginBottom: '4px' }}>
              왜 중요한가
            </div>
            <div style={{ fontSize: '0.8rem', lineHeight: 1.5, color: '#94A3B8' }}>
              {news.impact}
            </div>
          </div>
        </div>

        {/* Source */}
        <div style={{
          fontSize: '0.7rem',
          color: '#475569',
          marginTop: 'auto',
          paddingTop: '8px',
          borderTop: '1px solid #1E293B',
        }}>
          📰 {news.source}
        </div>
      </div>
      {renderDots()}
    </div>
  );

  const renderClosing = () => (
    <div style={cardStyle}>
      <div style={{
        ...innerCard,
        alignItems: 'center',
        textAlign: 'center',
        gap: '20px',
        border: '1px solid #334155',
      }}>
        <div style={{ fontSize: '0.85rem', color: '#3B82F6', fontWeight: '600', letterSpacing: '0.05em' }}>
          오늘의 키워드
        </div>
        <div style={{
          display: 'flex',
          flexWrap: 'wrap',
          justifyContent: 'center',
          gap: '8px',
        }}>
          {keywords.map((kw, i) => (
            <span key={i} style={{
              background: '#334155',
              color: '#E2E8F0',
              padding: '6px 14px',
              borderRadius: '20px',
              fontSize: '0.8rem',
              fontWeight: '500',
            }}>
              #{kw}
            </span>
          ))}
        </div>

        <div style={{
          width: '40px',
          height: '1px',
          background: '#334155',
          margin: '4px 0',
        }}/>

        <div>
          <div style={{ fontSize: '0.75rem', color: '#3B82F6', fontWeight: '600', marginBottom: '10px' }}>
            📝 오늘의 한 줄 총평
          </div>
          <div style={{
            fontSize: '0.9rem',
            lineHeight: 1.6,
            color: '#CBD5E1',
            padding: '0 8px',
          }}>
            {totalComment}
          </div>
        </div>

        <div style={{
          marginTop: 'auto',
          fontSize: '0.7rem',
          color: '#475569',
        }}>
          Powered by Claude
        </div>
      </div>
      {renderDots()}
    </div>
  );

  const renderDots = () => (
    <div style={{
      display: 'flex',
      justifyContent: 'center',
      gap: '6px',
      padding: '12px 0 8px 0',
      position: 'absolute',
      bottom: '38px',
      left: 0,
      right: 0,
    }}>
      {Array.from({ length: totalCards }).map((_, i) => (
        <button
          key={i}
          onClick={(e) => { e.stopPropagation(); goTo(i); }}
          style={{
            width: currentIndex === i ? '20px' : '6px',
            height: '6px',
            borderRadius: '3px',
            background: currentIndex === i ? '#3B82F6' : '#334155',
            border: 'none',
            padding: 0,
            cursor: 'pointer',
            transition: 'all 0.3s ease',
          }}
        />
      ))}
    </div>
  );

  const renderCard = () => {
    if (currentIndex === 0) return renderCover();
    if (currentIndex === totalCards - 1) return renderClosing();
    return renderNewsCard(newsData[currentIndex - 1], currentIndex - 1);
  };

  return (
    <div
      ref={containerRef}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
      style={{
        width: '100%',
        maxWidth: '393px',
        minHeight: '100vh',
        background: '#0F172A',
        position: 'relative',
        overflow: 'hidden',
      }}
    >
      {/* Navigation arrows for desktop */}
      {currentIndex > 0 && (
        <button
          onClick={() => goTo(currentIndex - 1)}
          style={{
            position: 'fixed',
            left: 'calc(50% - 196px - 44px)',
            top: '50%',
            transform: 'translateY(-50%)',
            width: '44px',
            height: '44px',
            borderRadius: '50%',
            background: '#1E293B',
            border: '1px solid #334155',
            color: '#94A3B8',
            fontSize: '1.2rem',
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 10,
          }}
        >
          ‹
        </button>
      )}
      {currentIndex < totalCards - 1 && (
        <button
          onClick={() => goTo(currentIndex + 1)}
          style={{
            position: 'fixed',
            right: 'calc(50% - 196px - 44px)',
            top: '50%',
            transform: 'translateY(-50%)',
            width: '44px',
            height: '44px',
            borderRadius: '50%',
            background: '#1E293B',
            border: '1px solid #334155',
            color: '#94A3B8',
            fontSize: '1.2rem',
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 10,
          }}
        >
          ›
        </button>
      )}
      {renderCard()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
